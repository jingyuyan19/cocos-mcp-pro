name: Bug report
description: Report a reproducible product or documentation problem
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: input
    id: product-version
    attributes:
      label: Cocos MCP Pro version
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: creator-version
    attributes:
      label: Cocos Creator version
      placeholder: 3.8.8
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client
      options:
        - Cursor
        - Windsurf
        - Cline
        - Claude Code
        - Codex
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a disposable project when possible.
      placeholder: "1. Open...\n2. Call...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include redacted cocos_diagnose output. Do not include assets, tokens, absolute paths, or the discovery file.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, project assets, absolute paths, and discovery-file contents.
          required: true
